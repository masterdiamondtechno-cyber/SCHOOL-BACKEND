version: '3.8'

services:
  # ── PostgreSQL Database Container ──────────────────────────────────────────
  postgres-db:
    image: postgres:16-alpine
    container_name: school_postgres
    restart: always
    environment:
      POSTGRES_DB: school
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: root
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # ── School Management Spring Boot Backend ──────────────────────────────────
  school-backend:
    build: .
    container_name: school_backend
    restart: always
    depends_on:
      - postgres-db
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=prod
      - DB_HOST=postgres-db
      - DB_PORT=5432
      - DB_NAME=school
      - DB_USER=postgres
      - DB_PASSWORD=root
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  uploads_data:
