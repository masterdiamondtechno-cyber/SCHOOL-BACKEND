server.port=8082
spring.application.name=subscription-service

# ── PostgreSQL Database ──────────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:school}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Razorpay Payment Gateway (Test / Live) ───────────────────
razorpay.key.id=${RAZORPAY_KEY_ID:rzp_test_dummy_key_id}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:dummy_secret_key}
razorpay.mock.enabled=${RAZORPAY_MOCK_ENABLED:true}

# ── Eureka Client Discovery ──────────────────────────────────
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}

# ── Mail Configuration (For Invoices & Reminders) ────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jiteshpatleofficial@gmail.com
