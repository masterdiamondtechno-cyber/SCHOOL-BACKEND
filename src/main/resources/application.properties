# ── AWS S3 Configuration (Study Material file storage) ─────────────────────
aws.region=ap-south-1
aws.accessKey=${AWS_ACCESS_KEY}
aws.secretKey=${AWS_SECRET_KEY}
aws.s3.bucket=schoolmangement-bucket-001
aws.light.max-file-size=50
# ── HEAVY BUCKET (Recoreded Lecture, 500MB) ───
aws.heavy.region=ap-south-1
aws.heavy.accessKey=${AWS_ACCESS_KEY}
aws.heavy.secretKey=${AWS_SECRET_KEY}
aws.heavy.s3.bucket=schoolmanagement-bucket-002
aws.heavy.max-file-size=500
# ── Multipart upload limits (50 MB max for study material files) ────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=550MB

# ── Razorpay Webhook Configuration ──────────────────────────────────────────
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET}

