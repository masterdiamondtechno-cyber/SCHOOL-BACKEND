spring.application.name=School Management System

# PostgreSQL Configuration (Clever Cloud production with local fallbacks)
spring.datasource.url=jdbc:postgresql://${POSTGRESQL_ADDON_HOST:localhost}:${POSTGRESQL_ADDON_PORT:5432}/${POSTGRESQL_ADDON_DB:school}
spring.datasource.username=${POSTGRESQL_ADDON_USER:postgres}
spring.datasource.password=${POSTGRESQL_ADDON_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
server.address=0.0.0.0
server.port=8080
spring.jpa.show-sql=true

# HikariCP connection pool tuning (AWS RDS stability)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.socket-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

#for mail services
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jiteshpatleofficial@gmail.com
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
