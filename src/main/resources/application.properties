spring.application.name=School Management System

# ── Local PostgreSQL Database Configuration ────────────────────────────────
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:school}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── JPA / Hibernate Settings ───────────────────────────────────────────────
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# ── Server Configuration ───────────────────────────────────────────────────
server.port=8080

# ── HikariCP Connection Pool ───────────────────────────────────────────────
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ── Mail Service Configuration ─────────────────────────────────────────────
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME:test@gmail.com}
spring.mail.password=${MAIL_PASSWORD:test}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# ── File Upload & Multipart Limits ─────────────────────────────────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=550MB

# ── AWS S3 Configuration (Local safe fallback) ─────────────────────────────
aws.region=${AWS_REGION:ap-south-1}
aws.accessKey=${AWS_ACCESS_KEY:local-access-key}
aws.secretKey=${AWS_SECRET_KEY:local-secret-key}
aws.s3.bucket=${AWS_S3_BUCKET:schoolmangement-bucket-001}
aws.light.max-file-size=50

# ── AWS S3 Heavy Bucket Configuration ──────────────────────────────────────
aws.heavy.region=${AWS_HEAVY_REGION:ap-south-1}
aws.heavy.accessKey=${AWS_HEAVY_ACCESS_KEY:local-access-key}
aws.heavy.secretKey=${AWS_HEAVY_SECRET_KEY:local-secret-key}
aws.heavy.s3.bucket=${AWS_HEAVY_S3_BUCKET:schoolmanagement-bucket-002}
aws.heavy.max-file-size=500

# ── Razorpay Configuration ──────────────────────────────────────────────────
razorpay.webhook.secret=${RAZORPAY_WEBHOOK_SECRET:LocalSecretKey123}

