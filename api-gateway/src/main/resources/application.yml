server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 1. Auth Service Routes
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**

        # 2. Subscription & Billing Service Routes
        - id: subscription-service
          uri: lb://subscription-service
          predicates:
            - Path=/api/subscription/**

        # 3. Core School, Students & Academic Service Routes
        - id: school-service
          uri: lb://school-service
          predicates:
            - Path=/api/AddSchool/**, /api/students/**, /api/teachers/**, /api/attendance/**, /api/fees/**, /api/exams/**, /api/timetable/**, /api/academic-year/**, /api/leave/**, /api/notification/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka
    register-with-eureka: true
    fetch-registry: true
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
  endpoint:
    health:
      show-details: always
