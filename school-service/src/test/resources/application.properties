# Test configuration - use H2 in-memory database instead of PostgreSQL
spring.application.name=demo

# H2 in-memory database for tests
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable mail during tests
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test
spring.mail.password=test
spring.mail.properties.mail.smtp.auth=false
spring.mail.properties.mail.smtp.starttls.enable=false

# AWS S3 Configuration for tests
aws.region=ap-south-1
aws.accessKey=${AWS_ACCESS_KEY:test-access-key}
aws.secretKey=${AWS_SECRET_KEY:test-secret-key}
aws.s3.bucket=schoolmangement-bucket-001
aws.light.max-file-size=50

# AWS S3 Heavy Bucket Configuration for tests
aws.heavy.region=ap-south-1
aws.heavy.accessKey=${AWS_ACCESS_KEY:test-access-key}
aws.heavy.secretKey=${AWS_SECRET_KEY:test-secret-key}
aws.heavy.s3.bucket=schoolmanagement-bucket-002
aws.heavy.max-file-size=500

