spring.application.name=school-service


# PostgreSQL Configuration (local)
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:school}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate settings
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update 
server.port=8083
spring.jpa.show-sql=true

# HikariCP connection pool tuning (AWS RDS stability)
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.socket-timeout=60000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.connection-test-query=SELECT 1

#for mail services
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=jiteshpatleofficial@gmail.com
spring.mail.password=qzbd ymnl dwya dqdg
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
# ── Eureka Client Discovery ──────────────────────────────────
eureka.client.service-url.defaultZone=http://${EUREKA_HOST:localhost}:8761/eureka
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.instance.prefer-ip-address=true
eureka.instance.instance-id=${spring.application.name}:${server.port}
# ── Local File Storage Configuration (Module-wise storage) ─────────────────────
file.upload-dir=uploads
# Sub-directories: uploads/logos, uploads/study-materials, uploads/syllabus, uploads/lectures
# ── Multipart upload limits (50 MB max for study material files) ────────────
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=500MB
spring.servlet.multipart.max-request-size=550MB

# ── Razorpay Payment Gateway (Test / Live) ─────────────────────────
razorpay.key.id=razorpay.key.secret=razorpay.mock.enabled=
spring.main.allow-bean-definition-overriding=true
